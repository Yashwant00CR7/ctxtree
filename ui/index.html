<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ctxtree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand" title="ctxtree: see what fills your context window, and delete what you no longer need">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="10" height="18" rx="2"/><rect x="12" y="1" width="7" height="10" rx="2"/><rect x="12" y="12" width="7" height="7" rx="2"/></svg>
      <span>ctxtree</span>
    </div>

    <button id="session-btn" class="session-btn" aria-haspopup="listbox">
      <span class="session-text">
        <span id="session-title" class="session-title">Loading sessions…</span>
        <span id="session-meta" class="session-meta"></span>
      </span>
      <svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg>
    </button>

    <div class="meter" id="meter" title="Tokens claude --resume sends for this session, against its context window">
      <div class="meter-text">
        <span id="meter-now">—</span>
        <span id="meter-after" class="meter-after"></span>
        <span id="meter-of" class="meter-of"></span>
      </div>
      <div class="meter-bar"><span id="meter-keep" class="keep"></span><span id="meter-cut" class="cut"></span></div>
    </div>

    <div class="seg" id="view-seg" role="tablist" aria-label="Organise by">
      <button data-view="tasks" role="tab" title="One folder per thing you asked for, oldest first">By task</button>
      <button data-view="types" role="tab" title="Grouped by what it is: setup, tool results, conversation">By type</button>
    </div>

    <div class="spacer"></div>
    <button id="btn-forks" class="ghost">Forks <span id="forks-count" class="count"></span></button>
    <button id="btn-rescan" class="ghost icon" title="Rescan sessions">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
    </button>
    <a class="ghost classic" href="/classic/" title="The previous interface: paragraph editor, bridges, continuity checks">Classic</a>
  </header>

  <main id="main">
    <section class="left" id="left">
      <div class="pane tree-pane" id="tree-pane">
        <div class="thead" id="thead">
          <button class="th c-name" data-sort="name">Name</button>
          <button class="th c-pct" data-sort="tok">% of parent</button>
          <button class="th c-tok" data-sort="tok">Tokens</button>
          <button class="th c-n" data-sort="n">Items</button>
          <button class="th c-turn" data-sort="turn">Turn</button>
          <span class="th c-x" aria-hidden="true"></span>
        </div>
        <div class="tbody" id="tree" tabindex="0" role="tree" aria-label="Context tree">
          <div class="spacer-rows" id="tree-spacer"></div>
        </div>
      </div>

      <div class="splitter h" id="split-h" role="separator" aria-orientation="horizontal"></div>

      <section class="map-pane" id="map-pane">
        <div class="map-bar">
          <span id="map-path" class="map-path"></span>
          <span class="map-hint">✕ or <kbd>⌫</kbd> marks for deletion · Right-click for more · Double-click to open</span>
        </div>
        <div class="map-wrap" id="map-wrap">
          <canvas id="map"></canvas>
          <canvas id="map-over"></canvas>
          <div id="tip" class="tip hidden"></div>
        </div>
      </section>
    </section>

    <div class="splitter v" id="split-v" role="separator" aria-orientation="vertical"></div>

    <div class="pane side-pane" id="side-pane">
      <div class="side-tabs" role="tablist" aria-label="Side panel">
        <button data-tab="details" role="tab" title="What the selection is and what it says (i)">Details</button>
        <button data-tab="types" role="tab" title="Tokens by type, like WizTree's extension list (t)">Types</button>
      </div>
      <div class="types" id="types-panel" role="tabpanel">
        <div class="thead">
          <span class="th c-type">Type</span>
          <span class="th c-pct">Percent</span>
          <span class="th c-tok">Tokens</span>
          <span class="th c-n">Items</span>
        </div>
        <div class="types-body" id="types"></div>
      </div>
      <div class="details" id="details" role="tabpanel">
        <div class="empty">Select anything to see what it is.</div>
      </div>
    </div>
  </main>

  <footer class="status">
    <span id="status-sel" class="status-sel"></span>
    <span class="spacer"></span>
    <button id="btn-reload" class="ghost small changed hidden" title="This session changed since you opened it">Session changed · Reload</button>
    <span id="status-marked" class="status-marked"></span>
    <button id="btn-undo" class="ghost small" title="Undo (⌘Z)" disabled>Undo</button>
    <button id="btn-review" class="primary" disabled>Review deletion</button>
  </footer>

  <div id="menu" class="menu hidden" role="menu"></div>

  <div id="session-pop" class="popover hidden" role="dialog" aria-label="Sessions">
    <input id="session-search" type="search" placeholder="Search sessions by prompt or project" autocomplete="off" spellcheck="false">
    <div id="session-list" class="session-list" role="listbox"></div>
  </div>

  <div id="scrim" class="scrim hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-label="Review deletion"></aside>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
